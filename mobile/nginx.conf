server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За прокси Coolify: не пытаемся сами делать редиректы на https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Для healthcheck контейнера: без обращения к диску и без логов.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Имена файлов сборки Flutter содержат хеш, поэтому их можно кэшировать
    # надолго. index.html и manifest — нет, иначе после деплоя у пользователя
    # останется старая версия приложения.
    location ~* \.(?:js|css|wasm|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Проверка ссылок доменом: по этим файлам iOS и Android решают, что
    # https://<домен>/i открывает наше приложение, а не браузер.
    #
    # Apple читает файл без расширения и требует application/json; ни
    # редиректа, ни подмены на index.html здесь быть не должно — иначе
    # проверка молча не проходит, и разбираться придётся по жалобам
    # «ссылка открывает браузер». Пишет эти файлы docker-entrypoint.d/40-links.sh
    # из окружения; не заданы значения — файла нет, и это честный 404.
    location /.well-known/ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Страница приглашения — тот самый адрес, что уходит в SMS и в письме.
    # Отдаём саму страницу, а не SPA-фолбэк: человек на медленной сети
    # получает килобайты вместо мегабайт Flutter-бандла.
    location = /i {
        try_files /i/index.html =404;
    }

    # Адреса магазинов для этой страницы: меняются окружением, поэтому не
    # кэшируются.
    location = /i/config.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Маршрутизация внутри приложения — на стороне клиента: любой неизвестный
    # путь отдаём index.html, иначе перезагрузка страницы даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Заголовки безопасности. CSP не ставим: Flutter web использует
    # wasm и inline-скрипты, строгая политика ломает загрузку.
    #
    # Они продублированы в location'ах выше не по недосмотру: nginx не
    # наследует add_header в блок, где объявлен хотя бы один свой заголовок.
    # Без дублирования сама страница приложения отдавалась без X-Frame-Options,
    # то есть её можно было встроить во фрейм на чужом сайте.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
