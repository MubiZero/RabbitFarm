server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За прокси Coolify: не пытаемся сами делать редиректы на https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Для healthcheck контейнера: без обращения к диску и без логов.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Имена файлов сборки Flutter содержат хеш, поэтому их можно кэшировать
    # надолго. index.html и manifest — нет, иначе после деплоя у пользователя
    # останется старая версия приложения.
    location ~* \.(?:js|css|wasm|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Маршрутизация внутри приложения — на стороне клиента: любой неизвестный
    # путь отдаём index.html, иначе перезагрузка страницы даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Заголовки безопасности. CSP не ставим: Flutter web использует
    # wasm и inline-скрипты, строгая политика ломает загрузку.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
