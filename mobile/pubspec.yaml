name: mobile
description: "RabbitFarm - Rabbit management application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.12.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Routing
  go_router: ^12.1.3

  # Push-уведомления. Web пока не поддерживается — там нужен отдельный
  # VAPID-ключ и service worker, это отдельная задача.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Продуктовая аналитика: несколько событий воронки (см. core/analytics).
  firebase_analytics: ^11.3.3

  # UI helpers
  flutter_hooks: ^0.20.3
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  # Открыть страницу оплаты банка во внешнем браузере/приложении (см.
  # docs/plans/PLATFORM-ADMIN.md, 4.1)
  url_launcher: ^6.3.1
  # Приглашение сотрудника по телефону приходит ссылкой
  # `rabbitfarm://join?phone=…` — она открывает приложение на экране входа с
  # уже подставленным номером (см. core/router/deep_links.dart).
  app_links: ^6.3.2

  # Utils
  # Хеш ПИН-кода быстрого входа: сам код на устройстве не хранится
  # (см. features/auth/data/pin_repository.dart).
  crypto: ^3.0.6
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  # Версия приложения в заголовке X-App-Version (см. core/api/api_client.dart)
  # — бэкенд по ней отличает сборки ниже минимальной поддерживаемой.
  package_info_plus: ^8.1.2
  # Крэш-репортинг. DSN опционален (см. `--dart-define=SENTRY_DSN`) — без
  # него SDK инициализируется в выключенном режиме, ошибки остаются только
  # в логе устройства, как и раньше.
  sentry_flutter: ^9.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.7.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Строки интерфейса лежат в lib/l10n/*.arb; flutter gen-l10n собирает
  # из них AppLocalizations. Русские окончания («1 задача» / «5 задач»)
  # считает ICU-плюрал, а не собственная таблица.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
