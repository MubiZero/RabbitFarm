# Значения секретов берутся из .env рядом с этим файлом (в git не хранится,
# шаблон — backend/.env.example). Без них compose откажется стартовать.
services:
  db:
    image: mysql:8.0
    container_name: rabbitfarm-db
    restart: always
    environment:
      MYSQL_DATABASE: rabbitfarm
      MYSQL_USER: rabbitfarm_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?задайте DB_ROOT_PASSWORD в .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 20s
      retries: 10

  # Хранилище загруженных файлов (фото кроликов). Здоровье проверяем через
  # встроенный `mc ready local` — образ minio его несёт сам, curl внутри нет.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: rabbitfarm-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?задайте MINIO_ROOT_USER в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
    command: server /data --console-address ":9001"
    ports:
      # 9000 — сам API, наружу не публикуем: к нему ходит только api по
      # внутренней сети compose. 9001 — веб-консоль, только на localhost.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rabbitfarm-api
    restart: always
    environment:
      - NODE_ENV=production
      # Cron-задачи считают «08:00» по времени контейнера, поэтому пояс задан
      # явно и совпадает с продом (см. backend/Dockerfile).
      - TZ=${TZ:-Asia/Dushanbe}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=rabbitfarm
      - DB_USER=rabbitfarm_user
      - DB_PASSWORD=${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      - PORT=4567
      - JWT_SECRET=${JWT_SECRET:?задайте JWT_SECRET в .env}
      - JWT_EXPIRE=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в .env}
      - JWT_REFRESH_EXPIRE=7d
      # Список источников для браузера через запятую. Мобильные клиенты
      # ходят без Origin и под ограничение не попадают.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000}
      # Без явной передачи переменная в контейнере отсутствует, а не «false»:
      # проверка `=== 'false'` не срабатывает, и регистрация оказывается
      # открытой по умолчанию. Значение по умолчанию здесь — то же самое
      # «закрыто», что и в backend/.env.example.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # Нижняя граница версии мобильного приложения: сборки ниже получают 426
      # и экран «обновитесь». Поднимать только вместе с выкладкой в сторы.
      - MIN_APP_VERSION=${MIN_APP_VERSION:-1.0.0}
      # Push-уведомления (FCM) — опционально, см. backend/.env.example.
      # Без этих трёх переменных notificationService молча ничего не шлёт.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      # Эсхата Мерчант (оплата подписки) — опционально, см. backend/.env.example.
      - ESKHATA_BASE_URL=${ESKHATA_BASE_URL:-}
      - ESKHATA_COMPANY_ID=${ESKHATA_COMPANY_ID:-}
      - ESKHATA_HASH_KEY=${ESKHATA_HASH_KEY:-}
      - ESKHATA_MERCHANT_ID=${ESKHATA_MERCHANT_ID:-}
      # Payom SMS (код сброса пароля) — опционально, см. backend/.env.example.
      - SMS_BASE_URL=${SMS_BASE_URL:-https://gateway.payom.tj}
      - SMS_API_TOKEN=${SMS_API_TOKEN:-}
      - SMS_SENDER_NAME=${SMS_SENDER_NAME:-}
      - SMS_TIMEOUT_SECONDS=${SMS_TIMEOUT_SECONDS:-15}
      - SMS_TEMPLATE_IDS=${SMS_TEMPLATE_IDS:-{}}
      # Почта (код сброса пароля) — опционально, см. backend/.env.example.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RabbitFarm}
      # Хранилище файлов — тот же minio, что и выше, по внутренней сети
      # compose. Учётка — root-пользователь бакета, для одного стенда
      # отдельный IAM-пользователь под API избыточен.
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?задайте MINIO_ROOT_USER в .env}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
      - MINIO_BUCKET=${MINIO_BUCKET:-rabbitfarm-uploads}
      # Демо-данные для разработки: три учётные записи с общеизвестными
      # паролями, породы, клетки и корма. В продакшене сидер откажется работать.
      # - RUN_SEEDS=true
    ports:
      - "4567:4567"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

  # Админка базы. Профиль debug: поднимается только явным
  # `docker compose --profile debug up`, чтобы форма входа в БД не оказалась
  # доступна всей сети при обычном старте стенда.
  adminer:
    image: adminer
    container_name: rabbitfarm-adminer
    restart: unless-stopped
    profiles: [debug]
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
  minio_data:
