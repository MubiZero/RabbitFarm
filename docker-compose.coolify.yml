# Прод-стек для Coolify. Локальная разработка — в docker-compose.yml.
#
# Секреты не хранятся ни здесь, ни в репозитории: Coolify генерирует их сам
# по «магическим» переменным SERVICE_* при первом деплое и держит у себя.
# Порты наружу не публикуются — трафик идёт через прокси Coolify, который
# сам выпускает и продлевает сертификаты.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rabbitfarm}
      - MYSQL_USER=${MYSQL_USER:-rabbitfarm}
      # Пароли генерирует Coolify: одинаковый идентификатор DB означает
      # одно и то же значение здесь и в сервисе api.
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_DB}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Проверяем не порт, а готовность отвечать на запросы: MySQL слушает
      # раньше, чем заканчивает инициализацию.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Домен и проксирование на порт 4567 настраивает Coolify по этой строке.
      - SERVICE_FQDN_API_4567=/
      - NODE_ENV=production
      - PORT=4567
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-rabbitfarm}
      - DB_USER=${MYSQL_USER:-rabbitfarm}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      # Секреты подписи токенов: 64 случайных hex-символа на каждый.
      - JWT_SECRET=${SERVICE_HEX_64_JWT}
      - JWT_EXPIRE=${JWT_EXPIRE:-15m}
      - JWT_REFRESH_SECRET=${SERVICE_HEX_64_JWTREFRESH}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-7d}
      # Браузерное приложение ходит с другого домена — разрешаем именно его,
      # а не «*»: со звёздочкой куки и авторизация работают небезопасно.
      - CORS_ORIGIN=${SERVICE_URL_WEB}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/jpg,image/webp}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Каждая регистрация заводит новую ферму — сервис многоарендный.
      # false закрывает публичную регистрацию совсем; сотрудников заводит
      # не регистрация, а приглашение по коду (см. README → Accounts).
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # Справочники наливаются только по явному указанию.
      # Демо-данные для разработки, не справочники: сидер заводит учётные
      # записи с общеизвестными паролями и при NODE_ENV=production падает.
      - RUN_SEEDS=${RUN_SEEDS:-false}
      # Push-уведомления (FCM) — опционально: без этих трёх значений сервис
      # просто ничего не отправляет, вместо падения при старте.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      # Эсхата Мерчант (оплата подписки) — опционально, см. backend/.env.example.
      - ESKHATA_BASE_URL=${ESKHATA_BASE_URL:-}
      - ESKHATA_COMPANY_ID=${ESKHATA_COMPANY_ID:-}
      - ESKHATA_HASH_KEY=${ESKHATA_HASH_KEY:-}
      - ESKHATA_MERCHANT_ID=${ESKHATA_MERCHANT_ID:-}
      # Payom SMS (код сброса пароля) — опционально, см. backend/.env.example.
      - SMS_BASE_URL=${SMS_BASE_URL:-https://gateway.payom.tj}
      - SMS_API_TOKEN=${SMS_API_TOKEN:-}
      - SMS_SENDER_NAME=${SMS_SENDER_NAME:-}
      - SMS_TIMEOUT_SECONDS=${SMS_TIMEOUT_SECONDS:-15}
      - SMS_TEMPLATE_IDS=${SMS_TEMPLATE_IDS:-{}}
      # Почта (код сброса пароля) — опционально, см. backend/.env.example.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RabbitFarm}
      # Хранилище фото — тот же minio, что и выше, по внутренней сети.
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - MINIO_BUCKET=${MINIO_BUCKET:-rabbitfarm-uploads}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        # У Flutter web нет рантайм-конфигурации: адрес API попадает в бандл
        # при сборке, поэтому смена домена API требует пересборки web.
        API_URL: ${SERVICE_URL_API}/api/v1
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_80=/
    # Зависимости от api намеренно нет: статика должна подниматься и когда
    # бэкенд лежит — приложение в этом случае показывает состояние ошибки
    # с кнопкой «Повторить», а не белый экран от недоступного контейнера.

volumes:
  db-data:
  minio-data:
