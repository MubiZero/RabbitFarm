name: Backend

# Проверки API на каждый push и pull request. До этого workflow тесты
# существовали, но нигде не запускались автоматически — сломать фермовую
# изоляцию или приглашения можно было незаметно.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: rabbitfarm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: rabbitfarm
      DB_TEST_NAME: rabbitfarm_test
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: ci_minio_user
      MINIO_SECRET_KEY: ci_minio_password
      MINIO_BUCKET: rabbitfarm-uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      # Галерея и лента фото бьют в настоящий MinIO, а не в мок: проверяется
      # в том числе, что файл действительно лёг в бакет и исчез при удалении.
      # `services:` для этого не годится — образу нужна команда `server /data`,
      # а сервисам её не передать.
      - name: Поднять MinIO для тестов загрузки
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$MINIO_ACCESS_KEY \
            -e MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY \
            quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z server /data
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          node -e "require('./src/config/minio').ensureBucket().then(() => console.log('bucket ready'))"

      - name: Тесты
        # Схема тестовой базы собирается миграциями (tests/integration/helpers/testDb.js),
        # поэтому этот шаг заодно проверяет, что миграции применяются с нуля.
        run: npm test

  migrations:
    # Отдельная проверка обратимости: down() у миграции легко написать
    # декоративно, и заметить это можно только попробовав откатиться.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: rabbitfarm_migrations
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=15

    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: rabbitfarm_migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Накатить все миграции
        run: npx sequelize-cli db:migrate --env development

      - name: Откатить все миграции
        run: npx sequelize-cli db:migrate:undo:all --env development

      - name: Накатить повторно
        run: npx sequelize-cli db:migrate --env development
