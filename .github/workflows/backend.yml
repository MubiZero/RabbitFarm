name: Backend

# Проверки API на каждый push и pull request. До этого workflow тесты
# существовали, но нигде не запускались автоматически — сломать фермовую
# изоляцию или приглашения можно было незаметно.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: rabbitfarm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: rabbitfarm
      DB_TEST_NAME: rabbitfarm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        # Схема тестовой базы собирается миграциями (tests/integration/helpers/testDb.js),
        # поэтому этот шаг заодно проверяет, что миграции применяются с нуля.
        run: npm test

  migrations:
    # Отдельная проверка обратимости: down() у миграции легко написать
    # декоративно, и заметить это можно только попробовав откатиться.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: rabbitfarm_migrations
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=15

    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: rabbitfarm_migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Накатить все миграции
        run: npx sequelize-cli db:migrate --env development

      - name: Откатить все миграции
        run: npx sequelize-cli db:migrate:undo:all --env development

      - name: Накатить повторно
        run: npx sequelize-cli db:migrate --env development
