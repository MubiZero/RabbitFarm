<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RabbitFarm</title>
<!--
  Страница приглашения. Её адрес (`/i`) уходит работнику в письме и через
  владельца, который пересылает ссылку сам. Адрес должен оставаться
  рабочим и после переезда: приглашение лежит в переписке дольше, чем
  занимает смена домена.

  С установленным приложением сюда никто не доходит: ссылку перехватывает
  само приложение (Universal Links на iOS, App Links на Android). Эта
  страница — то, что видит человек без приложения, то есть как раз новый
  работник. Поэтому она обходится без Flutter-бандла: несколько килобайт
  вместо нескольких мегабайт на медленной сети.

  Живёт на лендинге, а не в приложении: адрес `/i` уходит в SMS с главного
  домена, а его отдаёт витрина. Ссылки на магазины и адрес веб-версии
  приходят из `config.json`, который пишет `docker-entrypoint.sh` из
  переменных окружения. Пока приложение не опубликовано, переменных нет,
  файла нет, и кнопок нет тоже: вести человека в пустоту хуже, чем честно
  сказать, что магазины будут позже.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f3;
    --surface: #ffffff;
    --text: #1b1b1a;
    --muted: #5f5d58;
    --accent: #3f6f43;
    --accent-text: #ffffff;
    --border: #e2e0da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --surface: #1f2224;
      --text: #ecebe8;
      --muted: #a2a09a;
      --accent: #7fb082;
      --accent-text: #10210f;
      --border: #2e3234;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  .mark { font-size: 44px; line-height: 1; }
  h1 { margin: 16px 0 8px; font-size: 24px; }
  p { margin: 0 0 24px; color: var(--muted); }
  /* 56 — тот же размер, что у кнопок в приложении: в него попадают пальцем
     в рабочей перчатке. */
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    margin-bottom: 12px;
    padding: 0 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  a.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  a.btn:last-of-type { margin-bottom: 0; }
  .soon { margin: 0; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark">🐇</div>
  <h1 id="title">Вас зовут в хозяйство</h1>
  <p id="lead">Установите приложение и войдите по тому номеру или адресу, на который пришло приглашение — код придёт туда же.</p>

  <a class="btn primary" id="ios" href="#" hidden>App Store</a>
  <a class="btn primary" id="android" href="#" hidden>Google Play</a>
  <a class="btn" id="web" href="https://app.rabbitfarm.click">Открыть в браузере</a>

  <p class="soon" id="soon" hidden>Приложение скоро появится в App Store и Google Play.</p>
</main>

<script>
  // Строки прямо здесь: это отдельная статическая страница вне приложения,
  // тянуть ради четырёх фраз каталог ARB и Flutter-бандл незачем.
  var STRINGS = {
    ru: {
      title: 'Вас зовут в хозяйство',
      lead: 'Установите приложение и войдите по тому номеру или адресу, на который пришло приглашение — код придёт туда же.',
      web: 'Открыть в браузере',
      soon: 'Приложение скоро появится в App Store и Google Play.'
    },
    tg: {
      title: 'Шуморо ба хоҷагӣ даъват кардаанд',
      lead: 'Барномаро насб кунед ва бо ҳамон рақам ё почтае, ки даъват омад, ворид шавед — рамз ба ҳамон ҷо меояд.',
      web: 'Дар браузер кушоед',
      soon: 'Барнома ба зудӣ дар App Store ва Google Play пайдо мешавад.'
    },
    uz: {
      title: 'Sizni xoʻjalikka taklif qilishmoqda',
      lead: 'Ilovani oʻrnating va taklif kelgan raqam yoki pochta orqali kiring — kod ham shu yerga keladi.',
      web: 'Brauzerda ochish',
      soon: 'Ilova tez orada App Store va Google Play’da paydo boʻladi.'
    },
    en: {
      title: 'You have been invited to a farm',
      lead: 'Install the app and sign in with the phone number or email the invitation arrived at — the code will arrive there too.',
      web: 'Open in browser',
      soon: 'The app is coming to the App Store and Google Play.'
    }
  };

  var lang = (navigator.language || 'ru').slice(0, 2).toLowerCase();
  var t = STRINGS[lang] || STRINGS.ru;
  document.documentElement.lang = STRINGS[lang] ? lang : 'ru';
  document.getElementById('title').textContent = t.title;
  document.getElementById('lead').textContent = t.lead;
  document.getElementById('web').textContent = t.web;
  document.getElementById('soon').textContent = t.soon;

  // Кнопка магазина показывается только та, что человеку пригодится, и
  // только если адрес задан: пустая кнопка «App Store» на Android — ровно
  // то обещание без последствий, от которого мы уходим.
  fetch('config.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(function (cfg) {
      if (cfg.webUrl) {
        document.getElementById('web').href = cfg.webUrl;
      }

      var ua = navigator.userAgent || '';
      var isIos = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var shown = false;

      if (cfg.appStoreUrl && (isIos || !isAndroid)) {
        var ios = document.getElementById('ios');
        ios.href = cfg.appStoreUrl;
        ios.hidden = false;
        shown = true;
      }
      if (cfg.playStoreUrl && (isAndroid || !isIos)) {
        var android = document.getElementById('android');
        android.href = cfg.playStoreUrl;
        android.hidden = false;
        shown = true;
      }
      if (shown) {
        document.getElementById('web').classList.remove('primary');
      } else {
        document.getElementById('soon').hidden = false;
        document.getElementById('web').classList.add('primary');
      }
    });
</script>
</body>
</html>
