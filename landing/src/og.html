<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RabbitFarm</title>
<meta name="robots" content="noindex">
<!--
  Исходник картинки для ссылок в мессенджерах (og:image). Снимается
  браузером в assets/og.png:

    node landing/build.js
    chrome --headless --window-size=1200,630 \
      --screenshot=landing/src/assets/og.png http://localhost:5961/og.html

  Живёт рядом со страницей, а не в чужом редакторе, чтобы менялась вместе
  с текстами и палитрой лендинга.
-->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 48px;
    padding: 72px;
    background: #16181a;
    color: #ecebe8;
    font-family: 'Onest', system-ui, sans-serif;
    overflow: hidden;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand img { width: 34px; height: 34px; }
  .dot { color: #7fb082; }
  h1 {
    margin-top: 40px;
    font-size: 66px;
    line-height: 1.08;
    letter-spacing: -0.03em;
  }
  .accent { color: #7fb082; }
  p {
    margin-top: 28px;
    max-width: 24ch;
    font-size: 27px;
    line-height: 1.45;
    color: #a5a39d;
  }
  .phone {
    justify-self: center;
    width: 320px;
    padding: 10px;
    border: 1px solid #3d4245;
    border-radius: 30px;
    background: #1f2224;
  }
  .phone img {
    display: block;
    width: 100%;
    height: 470px;
    object-fit: cover;
    object-position: top center;
    border-radius: 22px;
  }
</style>
</head>
<body>
<div>
  <div class="brand">
    <img src="assets/mark.svg" alt="">
    <span>rabbitfarm<span class="dot">.click</span></span>
  </div>
  <h1>Учёт кроликов, <span class="accent">который делается на ходу</span></h1>
  <p>Окролы, корма, прививки и деньги хозяйства в телефоне.</p>
</div>
<div class="phone">
  <img src="assets/screens/home.webp" alt="">
</div>
</body>
</html>
