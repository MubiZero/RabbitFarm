server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За прокси Coolify: редиректы на https делает он, не мы.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Для healthcheck контейнера: без обращения к диску и без логов.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Шрифты и картинки не меняются между выкладками, страницы меняются.
    location ~* \.(?:woff2|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Стили и скрипт лежат по фиксированным именам, поэтому кэшируются коротко:
    # иначе правка текста не доедет до тех, кто уже открывал страницу.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Адреса приложения и сборки для Android: меняются окружением, не кэшируются.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Языковые страницы лежат каталогами: /tg/ отдаёт /tg/index.html.
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Заголовки безопасности. Политика содержимого строгая и без
    # 'unsafe-inline': на странице нет ни одного встроенного скрипта и ни
    # одного встроенного стиля, всё лежит своими файлами.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
}
